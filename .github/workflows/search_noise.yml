name: Search Noise Cleanup

on:
  schedule:
    - cron: '30 4 * * *'   # diario a las 4:30am UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (solo lista lo que apagaría, no escribe)'
        type: boolean
        default: false
      since_days:
        description: 'Días hacia atrás a revisar (3650 = todo el historial)'
        type: string
        default: '7'

# Apaga (activo=false) las búsquedas sinsentido de search_queries —"vijomc", "sxgtow"— y
# el producto sin marca que el buscador haya creado a partir de una, antes de que junte
# consultas y aparezca en "Trending ahora". Reversible: no borra nada.
#
# Diaria con ventana de 7 días: el solapamiento cubre una corrida fallida sin tener que
# acordarse de nada. Si en la ventana no hay búsquedas de una sola palabra, no baja el
# catálogo (~1,3 MB de egress cuando sí).
#
# Independiente del resto: no toca data/ ni la tabla ingredients, así que queda fuera
# del grupo de concurrencia.
permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  # La tarea no usa LLM, pero incilab_seed.py corta al arrancar si falta esta clave.
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  search_noise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone private repo
        run: git clone https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/CamiLara/incilab-enrich.git repo

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        working-directory: repo
        run: pip install -r requirements.txt

      - name: Strip newlines from secrets
        run: |
          echo "SUPABASE_URL=$(printenv SUPABASE_URL | tr -d '\n\r')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_KEY=$(printenv SUPABASE_SERVICE_KEY | tr -d '\n\r')" >> $GITHUB_ENV
          echo "OPENROUTER_API_KEY=$(printenv OPENROUTER_API_KEY | tr -d '\n\r')" >> $GITHUB_ENV

      # El input pasa por env y se valida como número: nunca se interpola en el comando.
      - name: clean_search_noise
        working-directory: repo
        env:
          SINCE_DAYS: ${{ inputs.since_days || '7' }}
        run: |
          [[ "$SINCE_DAYS" =~ ^[0-9]+$ ]] || { echo "since_days tiene que ser un número"; exit 1; }
          python3 incilab_seed.py --task clean_search_noise --since-days "$SINCE_DAYS" ${{ inputs.dry_run && '--dry-run' || '' }}
