name: Image Audit

on:
  schedule:
    - cron: '0 5 * * *'   # diario a las 5am UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no marca ni oculta nada, solo reporta)'
        type: boolean
        default: false

# Independiente de pipeline.yml/ingredients.yml/retry.yml: no toca data/ (la
# resumibilidad vive en products_cache.image_audit_checked_at, no en un archivo
# de estado local), así que no necesita el grupo de concurrencia de esos otros
# workflows ni un paso de "guardar estado en el repo".
permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  # Opcional: habilita la capa de imagen de referencia (busca en Google cómo se ve el
  # producto y compara por perceptual hash). Si el secret no existe, esa capa se saltea
  # sola y el resto funciona igual. OJO: es la misma clave que usa incilab-web-api para
  # buscar INCI (2.500/mes en el plan gratis), por eso --max-serper la topea.
  SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
  PYTHONUNBUFFERED: "1"

jobs:
  image_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone private repo
        run: git clone https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/CamiLara/incilab-enrich.git repo

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        working-directory: repo
        run: pip install -r requirements.txt

      # OCR de la capa 1 — no está en requirements.txt porque pesa ~300MB (onnxruntime,
      # opencv, scipy) y ninguna otra tarea lo usa, mismo criterio que playwright.
      # Sin esto la tarea igual corre, pero todo escala a visión y come cuota al pedo.
      - name: Instalar OCR (capa 1)
        working-directory: repo
        run: pip install rapidocr-onnxruntime

      - name: Strip newlines from secrets
        run: |
          echo "SUPABASE_URL=$(printenv SUPABASE_URL | tr -d '\n\r')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_KEY=$(printenv SUPABASE_SERVICE_KEY | tr -d '\n\r')" >> $GITHUB_ENV
          echo "OPENROUTER_API_KEY=$(printenv OPENROUTER_API_KEY | tr -d '\n\r')" >> $GITHUB_ENV
          echo "SERPER_API_KEY=$(printenv SERPER_API_KEY | tr -d '\n\r')" >> $GITHUB_ENV

      # 250 por corrida, con los dos topes explícitos aunque coincidan con los defaults
      # (que se lean acá, sin tener que abrir el script):
      #   --max-serper 25  cuota COMPARTIDA con el buscador de INCI de incilab-web-api
      #                    (2.500/mes en el plan gratis) → ~750/mes, 30%, deja margen.
      #   --max-vision 60  los modelos gratis de visión aguantan decenas de llamadas por
      #                    corrida, no cientos: sin tope, una corrida con 591 pendientes
      #                    las intentaba todas y no resolvía ninguna.
      # Lo que excede los topes queda SIN MARCAR y lo toma la corrida del día siguiente
      # — la resumibilidad la da products_cache.image_audit_checked_at (ver
      # incilab-db/migrations/image_audit_migration.sql), así que nada se reprocesa.
      - name: image_audit
        working-directory: repo
        run: python3 incilab_seed.py --task image_audit --limit 250 --workers 4 --max-serper 25 --max-vision 60 ${{ inputs.dry_run && '--dry-run' || '' }}
